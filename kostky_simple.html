<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hrací kostka na vyšším levelu</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #312e81 50%, #1e1b4b 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Glassmorphism efekt pro panely */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .scene {
            width: 160px;
            height: 160px;
            perspective: 800px; /* Hloubka 3D prostoru */
            margin: 40px auto;
            cursor: pointer;
            position: relative;
            z-index: 10;
        }

        /* Obal pro plynulé levitování kostky, když je v klidu */
        .cube-wrapper {
            width: 100%;
            height: 100%;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Samotná kostka, na kterou aplikujeme rotace z JS */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.1); /* Plynulý "pružinový" dojezd */
            transform: rotateX(-15deg) rotateY(15deg); /* Výchozí natočení */
        }

        .cube__face {
            position: absolute;
            width: 160px;
            height: 160px;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            border: 2px solid #cbd5e1;
            border-radius: 24px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 0 0 10px rgba(0,0,0,0.2);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 16px;
            gap: 8px;
            backface-visibility: hidden; /* Odstraní vizuální artefakty */
        }

        .dot {
            background: radial-gradient(circle at 30% 30%, #475569, #0f172a);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            justify-self: center;
            align-self: center;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.6), 0 2px 2px rgba(255,255,255,0.8);
        }

        /* Umístění teček v mřížce (3x3 grid) */
        .dot-1 { grid-area: 1 / 1; }
        .dot-2 { grid-area: 1 / 2; }
        .dot-3 { grid-area: 1 / 3; }
        .dot-4 { grid-area: 2 / 1; }
        .dot-5 { grid-area: 2 / 2; }
        .dot-6 { grid-area: 2 / 3; }
        .dot-7 { grid-area: 3 / 1; }
        .dot-8 { grid-area: 3 / 2; }
        .dot-9 { grid-area: 3 / 3; }

        .cube__face--front  { transform: rotateY(  0deg) translateZ(80px); } /* 1 */
        .cube__face--bottom { transform: rotateX(-90deg) translateZ(80px); } /* 2 */
        .cube__face--right  { transform: rotateY( 90deg) translateZ(80px); } /* 3 */
        .cube__face--left   { transform: rotateY(-90deg) translateZ(80px); } /* 4 */
        .cube__face--top    { transform: rotateX( 90deg) translateZ(80px); } /* 5 */
        .cube__face--back   { transform: rotateY(180deg) translateZ(80px); } /* 6 */

        /* Stín pod kostkou */
        .floor-shadow {
            width: 120px;
            height: 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            margin: 0 auto;
            filter: blur(10px);
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        /* Animace pro nové položky v historii */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .history-item {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-8">

    <div class="glass-panel w-full max-w-5xl rounded-3xl p-6 md:p-10 flex flex-col md:flex-row gap-10 shadow-2xl relative overflow-hidden">
        
        <!-- Ozdobný světelný prvek na pozadí panelu -->
        <div class="absolute -top-32 -left-32 w-64 h-64 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 pointer-events-none"></div>
        <div class="absolute -bottom-32 -right-32 w-64 h-64 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 pointer-events-none"></div>

        <!-- Levý sloupec: Hrací plocha -->
        <div class="flex-1 flex flex-col items-center justify-center z-10 relative">
            <div class="text-center mb-8">
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-purple-300">
                    Virtuální Kostka
                </h1>
                <p class="text-indigo-200 mt-2 font-medium">Klikni na kostku nebo na tlačítko pro hod</p>
            </div>

            <div class="scene group" onclick="hodKostkou()" aria-label="Hodit kostkou" role="button">
                <div class="cube-wrapper">
                    <div class="cube" id="cube">
                        <!-- Strana 1 -->
                        <div class="cube__face cube__face--front">
                            <div class="dot dot-5"></div>
                        </div>
                        <!-- Strana 2 -->
                        <div class="cube__face cube__face--bottom">
                            <div class="dot dot-3"></div>
                            <div class="dot dot-7"></div>
                        </div>
                        <!-- Strana 3 -->
                        <div class="cube__face cube__face--right">
                            <div class="dot dot-1"></div>
                            <div class="dot dot-5"></div>
                            <div class="dot dot-9"></div>
                        </div>
                        <!-- Strana 4 -->
                        <div class="cube__face cube__face--left">
                            <div class="dot dot-1"></div>
                            <div class="dot dot-3"></div>
                            <div class="dot dot-7"></div>
                            <div class="dot dot-9"></div>
                        </div>
                        <!-- Strana 5 -->
                        <div class="cube__face cube__face--top">
                            <div class="dot dot-1"></div>
                            <div class="dot dot-3"></div>
                            <div class="dot dot-5"></div>
                            <div class="dot dot-7"></div>
                            <div class="dot dot-9"></div>
                        </div>
                        <!-- Strana 6 -->
                        <div class="cube__face cube__face--back">
                            <div class="dot dot-1"></div>
                            <div class="dot dot-3"></div>
                            <div class="dot dot-4"></div>
                            <div class="dot dot-6"></div>
                            <div class="dot dot-7"></div>
                            <div class="dot dot-9"></div>
                        </div>
                    </div>
                </div>
                <!-- Stín pod kostkou -->
                <div id="floorShadow" class="floor-shadow group-hover:scale-110"></div>
            </div>

            <!-- Tlačítko pro házení -->
            <button id="rollBtn" onclick="hodKostkou()" class="mt-12 w-full max-w-[250px] relative inline-flex h-14 items-center justify-center overflow-hidden rounded-xl bg-indigo-600 font-bold text-white shadow-lg transition-all hover:bg-indigo-500 hover:scale-105 active:scale-95 disabled:opacity-50 disabled:pointer-events-none disabled:hover:scale-100">
                <span class="mr-2 text-xl">🎲</span> HODIT KOSTKOU
            </button>
            <div id="statusText" class="h-6 mt-4 text-indigo-300 font-medium text-lg transition-opacity duration-300 opacity-0">Kostka se točí...</div>
        </div>

        <div class="w-full md:w-80 bg-white/5 rounded-2xl border border-white/10 p-5 flex flex-col z-10 max-h-[500px]">
            <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-4">
                <h2 class="text-2xl font-bold flex items-center">
                    <svg class="w-6 h-6 mr-2 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Historie
                </h2>
                <span id="rollCount" class="bg-indigo-500/30 text-indigo-200 text-xs font-bold px-2.5 py-1 rounded-full">0 hodů</span>
            </div>
            
            <div id="historyList" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-3 custom-scrollbar">
                <!-- Zástupný text prázdné historie -->
                <div id="emptyHistory" class="text-center text-indigo-200/50 italic py-8">
                    Zatím jsi neházel. Zkus štěstí!
                </div>
                <!-- Zde se budou generovat předchozí hody z JS -->
            </div>
        </div>
    </div>

    <script>
        // Stavové proměnné
        let isRolling = false;
        let currentX = -15; // Výchozí natočení osy X, aby kostka vypadala 3D
        let currentY = 15;  // Výchozí natočení osy Y
        let pocetHodu = 0;

        // Odkazy na DOM elementy
        const cube = document.getElementById("cube");
        const rollBtn = document.getElementById("rollBtn");
        const historyList = document.getElementById("historyList");
        const emptyHistory = document.getElementById("emptyHistory");
        const statusText = document.getElementById("statusText");
        const rollCountBadge = document.getElementById("rollCount");
        const floorShadow = document.getElementById("floorShadow");

        function hodKostkou() {
            // Pokud už se kostka točí, nedělej nic (zabrání spamu)
            if (isRolling) return;
            
            // 1. Zahájení animace
            isRolling = true;
            rollBtn.disabled = true;
            cube.style.cursor = "default";
            statusText.style.opacity = "1";
            
            // Zmenšení stínu simulující "výskok" kostky
            floorShadow.style.transform = "scale(0.7)";
            floorShadow.style.opacity = "0.5";

            // 2. Vygenerování náhodného čísla (1 až 6)
            const vylosovaneCislo = Math.floor(Math.random() * 6) + 1;

            // 3. Výpočet koncového natočení (Target Rotations), 
            //    aby daná stěna směřovala na uživatele.
            let targetX = 0;
            let targetY = 0;

            switch(vylosovaneCislo) {
                case 1: targetX = 0;   targetY = 0;    break; // Přední strana
                case 2: targetX = 90;  targetY = 0;    break; // Spodní strana -> natočit nahoru (+90x)
                case 3: targetX = 0;   targetY = -90;  break; // Pravá strana -> natočit doleva (-90y)
                case 4: targetX = 0;   targetY = 90;   break; // Levá strana -> natočit doprava (+90y)
                case 5: targetX = -90; targetY = 0;    break; // Horní strana -> natočit dolů (-90x)
                case 6: targetX = 0;   targetY = 180;  break; // Zadní strana
            }

            // Přidáme náhodný počet celých otoček (360 stupňů) pro efekt dramatického kutálení.
            // Zajišťujeme, že se vždy otočí minimálně 3x v obou osách.
            const extraSpinsX = (Math.floor(Math.random() * 4) + 3) * 360; 
            const extraSpinsY = (Math.floor(Math.random() * 4) + 3) * 360; 
            
            // Náhodný směr rotace (dopředu nebo dozadu) pro nepředvídatelnost
            const directionX = Math.random() > 0.5 ? 1 : -1;
            const directionY = Math.random() > 0.5 ? 1 : -1;

            // Zjistíme "základ" naší aktuální rotace bez zbytků úhlů (zarovnáme na násobky 360)
            const baseX = Math.round(currentX / 360) * 360;
            const baseY = Math.round(currentY / 360) * 360;

            // Vypočteme finální úhel natočení: 
            // K nejbližšímu násobku 360 přičteme otočky navíc a nakonec přidáme cílový úhel (target)
            currentX = baseX + (extraSpinsX * directionX) + targetX;
            currentY = baseY + (extraSpinsY * directionY) + targetY;

            // Aplikujeme CSS transformaci. Zajišťuje to atribut `transition: transform 1.5s` v CSS.
            cube.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;

            // 4. Počkáme na dokončení animace (1.5 sekundy)
            setTimeout(() => {
                // Obnovíme stav
                isRolling = false;
                rollBtn.disabled = false;
                cube.style.cursor = "pointer";
                statusText.style.opacity = "0";
                
                // Vrátíme stín do normálu (kostka "dopadla")
                floorShadow.style.transform = "scale(1)";
                floorShadow.style.opacity = "1";

                // Zaznamenáme do historie
                pridejDoHistorie(vylosovaneCislo);
            }, 1500); 
        }

        function pridejDoHistorie(cislo) {
            pocetHodu++;
            
            // Skryjeme zástupný text, pokud to byl první hod
            if(emptyHistory) emptyHistory.style.display = 'none';
            rollCountBadge.textContent = `${pocetHodu} hod${pocetHodu > 1 && pocetHodu < 5 ? 'y' : (pocetHodu >= 5 ? 'ů' : '')}`;

            // Vytvoření nového elementu pro historii
            const item = document.createElement("div");
            item.className = "history-item bg-white/10 hover:bg-white/20 transition-colors rounded-xl p-3 flex items-center justify-between border border-white/5 backdrop-blur-sm shadow-sm";
            
            // Obsah položky (číslo hodu + grafické znázornění výsledku)
            item.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-900/50 flex items-center justify-center font-bold text-indigo-300 text-sm border border-indigo-700/30">
                        #${pocetHodu}
                    </div>
                    <span class="text-white font-medium text-lg">Padlo číslo</span>
                </div>
                <div class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-br from-blue-200 to-purple-400 w-10 text-center">
                    ${cislo}
                </div>
            `;

            // Přidáme na začátek seznamu (nahoru)
            historyList.prepend(item);
        }
    </script>
</body>
</html>
